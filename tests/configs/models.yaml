  - {id: mock-titan, endpoint: mock-invoke, api_model: "amazon.titan-embed-text-v2:0", task: embedding,
     options: {bedrock_flavor: titan, batch_size: 16, dimensions: 256}}
  - {id: mock-rerank, endpoint: mock, api_model: mock-rerank, task: rerank}
  - {id: mock-ocr-a, endpoint: mock, api_model: mock-ocr-a, task: ocr, options: {concurrency: 4}}
  - {id: mock-ocr-b, endpoint: mock, api_model: mock-ocr-b, task: ocr, options: {concurrency: 4}}
  - {id: mock-asr, endpoint: mock, api_model: mock-asr, task: asr, options: {language: tr}}
  - {id: mock-laya, endpoint: mock, api_model: mock-laya, task: decision}
  - {id: mock-clef, endpoint: mock, api_model: mock-clef, task: decision, options: {batch: false}}
  - {id: mock-uocr, endpoint: local, api_model: baidu/Unlimited-OCR, task: local_ocr,
     options: {backend: worker, revision: test, concurrency: 1, crop_mode: true, max_length: 8192}}
