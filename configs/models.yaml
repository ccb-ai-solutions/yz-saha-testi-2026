  # Unlimited-OCR (Baidu, MIT, 3B, BF16 weights 6.67 GB, not gated; pinned to the commit of 14 Oct): runs on this PC's
  # GPU in its own environment .venv-ocr (its code was tested with transformers 4.57.1 / torch 2.10; .venv has 5.x),
  # created by scripts\setup_unlimited_ocr.ps1; harness/local/ocr_worker.py talks to it. Model card settings ("gundam":
  # base 1024 + 640 crops, no_repeat_ngram 35 in a 128 window) except max_length 8192 instead of 32768: our pages need
  # < 3k output tokens, and it bounds a runaway page and the KV cache on an 8 GB GPU. A page that runs out of GPU
  # memory is read again in base mode (one 1024 view), recorded per page.
  - {id: unlimited-ocr, endpoint: local, api_model: baidu/Unlimited-OCR, task: local_ocr, family: unlimited-ocr,
     params_total_b: 3.0, license: MIT,
     options: {backend: worker, python: auto, revision: 07dea832e22aefee32ad281d4b80551282e1c168, concurrency: 1,
               prompt: "<image>document parsing.", base_size: 1024, image_size: 640, crop_mode: true,
               max_length: 8192, no_repeat_ngram_size: 35, ngram_window: 128, fallback_base_mode: true,
               startup_timeout_s: 3600, page_timeout_s: 900},
     notes: "local GPU (bf16) via its own environment .venv-ocr; text = the model card's post-processing of the det blocks"}

